name: hgt_site
owner: iuc
description: Call candidate horizontal gene transfer sites from host alignments and Kraken2 read classifications
long_description: |
  hgt-site finds places where DNA from bacteria or other organisms may have been
  inserted into a host genome, using paired-end reads aligned to the host and
  Kraken2 classifications of the reads that did not align. Each candidate site
  is tested against what chance chimeras would produce, and likely artefacts
  are flagged.
homepage_url: https://github.com/iraajgangavaram/hgt-site
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/hgt_site
type: unrestricted
categories:
  - Metagenomics
  - Sequence Analysis
  - Variant Analysis
