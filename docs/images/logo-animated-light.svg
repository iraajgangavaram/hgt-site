<g class="f7"><text x="363.92" y="68" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#0b0b0b">e</text></g>
<text class="sub" x="216" y="96" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#52514e">horizontal gene transfer site caller</text>
