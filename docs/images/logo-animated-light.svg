<svg xmlns="http://www.w3.org/2000/svg" width="560" height="120" viewBox="0 0 560 120" role="img" aria-label="hgt-site, a horizontal gene transfer site caller">
<style>
g{transform-box:fill-box;transform-origin:center}
@keyframes hostL{0%{opacity:0;transform:translateX(-90px)}14%,94%{opacity:1;transform:translateX(0)}100%{opacity:0}}
@keyframes hostR{0%{opacity:0;transform:translateX(90px)}14%,94%{opacity:1;transform:translateX(0)}100%{opacity:0}}
@keyframes drop{0%,13%{opacity:0;transform:translateY(-34px) scaleX(.4)}26%,94%{opacity:1;transform:translateY(0) scaleX(1)}100%{opacity:0}}
@keyframes mark{0%,27%{opacity:0}36%,94%{opacity:1}100%{opacity:0}}
@keyframes sub{0%,48%{opacity:0}58%,94%{opacity:1}100%{opacity:0}}
.hostL{animation:hostL 9.0s cubic-bezier(.2,.8,.3,1) infinite}
.hostR{animation:hostR 9.0s cubic-bezier(.2,.8,.3,1) infinite}
.drop{animation:drop 9.0s cubic-bezier(.2,.8,.3,1) infinite}
.mark{animation:mark 9.0s ease-out infinite}
.sub{animation:sub 9.0s ease-out infinite}
@keyframes f0{0%,32.22%{opacity:0;transform:translate(-60px,-56px) rotate(42deg) scale(.5)}43.33%,94%{opacity:1;transform:translate(0,0) rotate(0) scale(1)}100%{opacity:0}}
