<svg xmlns="http://www.w3.org/2000/svg" width="860" height="381" viewBox="0 0 860 381" role="img" aria-label="A terminal showing hgt-site being installed and run, printing 21 candidate sites that passed the filters">
<rect x="0.5" y="0.5" width="859" height="380" rx="10" fill="#faf9f7" stroke="#e4e3df"/>
<line x1="0" y1="32" x2="860" y2="32" stroke="#e4e3df"/>
<circle cx="22" cy="16.5" r="5" fill="#eb6834" opacity="0.85"/>
<circle cx="40" cy="16.5" r="5" fill="#eda100" opacity="0.85"/>
<circle cx="58" cy="16.5" r="5" fill="#1baf7a" opacity="0.85"/>
<text x="430.0" y="21" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#52514e">hgt-site</text>
<text x="20.0" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1baf7a">$</text>
<text x="36" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#0b0b0b" xml:space="preserve">pip install hgt-site</text>
<text x="20.0" y="81" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1baf7a">$</text>
<text x="36" y="81" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#0b0b0b" xml:space="preserve">hgt-site run --bam sample.bam --kraken-db kraken2-db \</text>
<text x="36" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#0b0b0b" xml:space="preserve">    --host-taxid 9606 --threads 8 -o sites.tsv --vcf sites.vcf</text>
<text x="20" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#52514e" xml:space="preserve">INFO: Wrote 105187 unmapped reads.</text>
<text x="20" y="165" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#52514e" xml:space="preserve">INFO: Running Kraken2 on the unmapped reads.</text>
<text x="20" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#52514e" xml:space="preserve">INFO: 2107 anchored pairs have a Kraken2 call; 2107 are from taxa outside the host.</text>
<text x="20" y="207" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#52514e" xml:space="preserve">INFO: Fragment size from 100000 pairs: median 400 bp, 99th percentile 494 bp.</text>
<text x="20" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#52514e" xml:space="preserve">INFO: Exact junctions from split reads found for 20 of 21 sites that passed.</text>
<text x="20" y="249" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#2a78d6" xml:space="preserve">1701 candidate sites, 21 passed filters -&gt; sites.tsv</text>
<text x="20.0" y="291" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1baf7a">$</text>
<text x="36" y="291" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#0b0b0b" xml:space="preserve">head -3 sites.tsv | cut -f1-3,6,7,10,13</text>
<text x="20" y="312" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#52514e" xml:space="preserve">chrom        start     end       left_breakpoint  split_reads  n_pairs  top_taxid</text>
<text x="20" y="333" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#0b0b0b" xml:space="preserve">chr21_20M    638838    639307    639072           8            11       562</text>
<text x="20" y="354" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#0b0b0b" xml:space="preserve">chr21_20M    819852    820366    820112           4            18       562</text>
</svg>
