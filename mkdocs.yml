site_name: hgt-site
site_description: Call candidate horizontal gene transfer sites from host alignments and Kraken2 read classifications
site_author: Iraaj Gangavaram
site_url: https://iraajgangavaram.github.io/hgt-site/
repo_url: https://github.com/iraajgangavaram/hgt-site
repo_name: iraajgangavaram/hgt-site
edit_uri: ""
copyright: Iraaj Gangavaram, MIT licence

docs_dir: docs
exclude_docs: |
  pypi.md

nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  - Output: output.md
  - How it works: method.md
  - Benchmarks: benchmarks.md
  - Is it worth trying?: for-labs.md
  - Citation: citation.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
