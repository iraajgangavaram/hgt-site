name: update stats

# Refreshes the install count in the figures panel at the top of the README.
# The panel is a generated SVG rather than a badge, because a badge cannot be
# made large or animated, and the number is worth more than a grey meter.
#
# Only the install count is fetched. The benchmark numbers beside it live in
# the script and change when the benchmark is rerun, not nightly.

on:
  schedule:
    - cron: "19 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-stats.yml"
      - "scripts/make_stats_svg.py"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the install count from Anaconda
        id: count
        run: |
          # total_ndownloads is the figure the Bioconda badge uses.
          n=$(curl -fsSL --retry 3 --retry-delay 5 \
                https://api.anaconda.org/package/bioconda/hgt-site \
              | python -c 'import json,sys; print(json.load(sys.stdin)["total_ndownloads"])')
          # Guard against a malformed response quietly writing a nonsense
          # number into the README, and against the count going backwards.
          old=$(python -c 'import json; print(json.load(open("docs/stats.json"))["conda_downloads"])')
          if ! [ "$n" -eq "$n" ] 2>/dev/null || [ "$n" -lt "$old" ]; then
            echo "refusing $n against the stored $old"
            exit 1
          fi
          echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "old=$old" >> "$GITHUB_OUTPUT"

      - name: Rebuild the panel
        if: steps.count.outputs.n != steps.count.outputs.old
        run: |
          python -c "
          import json, pathlib
          p = pathlib.Path('docs/stats.json')
          d = json.loads(p.read_text())
          d['conda_downloads'] = ${{ steps.count.outputs.n }}
          p.write_text(json.dumps(d, indent=2) + '\n')
          "
          python scripts/make_stats_svg.py

      - name: Commit
        if: steps.count.outputs.n != steps.count.outputs.old
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/stats.json docs/images/stats-light.svg docs/images/stats-dark.svg
          git diff --cached --quiet && exit 0
          git commit -m "Install count ${{ steps.count.outputs.old }} to ${{ steps.count.outputs.n }}"
          git push
